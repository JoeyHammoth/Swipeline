name: Documentation issue
description: A page is wrong, stale, missing or confusing.
title: "docs: "
labels: ["documentation"]
assignees: ["JoeyHammoth"]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: docs/concepts/ranking.md#cold-start, or a URL
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the text if it is short. "This is confusing" is fine if you say why.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Optional — a corrected sentence is more useful than a rewrite request.

  - type: checkboxes
    id: kind
    attributes:
      label: Kind of problem
      options:
        - label: Factually wrong
        - label: Code snippet does not work
        - label: Missing information
        - label: Broken link
        - label: Unclear writing
