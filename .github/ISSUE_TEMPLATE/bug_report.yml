name: Bug report
description: Something is broken or behaves differently from the docs.
title: "fix: "
labels: ["bug"]
assignees: ["JoeyHammoth"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please reduce it to the smallest reproduction — a deck
        config, an adapter mapping and the events involved are usually enough.

        Security problems go to the private advisory form, not here.

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behaviour, including the error message or console output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, a minimal repo link, or the config and events that trigger it.
      placeholder: |
        1. Deck config: ...
        2. Swipe: ...
        3. Observed: ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - core (schemas, engine, stores)
        - ranking
        - adapters
        - react binding
        - web component / gestures
        - react native
        - server / sync
        - cli / scaffolding
        - docs
        - not sure
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package versions, Node version, browser or OS.
      placeholder: "@swipeline/core 0.1.0, React 19.3, Node 24.22, Safari 27"
    validations:
      required: true

  - type: dropdown
    id: accessibility
    attributes:
      label: Accessibility impact
      description: Does this affect keyboard, screen reader or motion-sensitive users?
      options:
        - "No"
        - "Yes — keyboard"
        - "Yes — screen reader"
        - "Yes — motion / reduced motion"
        - "Yes — contrast or zoom"
    validations:
      required: true
