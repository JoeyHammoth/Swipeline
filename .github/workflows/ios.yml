name: iOS

# Runs the Expo smoke app on an iOS simulator: prebuild, CocoaPods, a Release
# xcodebuild, install, launch, then the app's own scripted-swipe result read from
# the simulator log. Weekly and on demand — a run is a cold pods install plus a
# native build, which is too slow for every pull request.
on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Expo smoke app on an iOS simulator
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Generate the native project
        working-directory: examples/books-expo
        run: npx expo prebuild --platform ios

      - name: Build, install and launch on a simulator
        run: bash examples/books-expo/scripts/ios-smoke.sh
