name: Android smoke

# The native deck, actually running: builds the Expo example's release APK and
# drives it on an emulator, then checks that the scripted swipe reported a like.
# Weekly and on demand — an emulator boot plus a Gradle build is too slow to sit
# in front of every pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Expo smoke app on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # The emulator needs /dev/kvm; the runner user is not in the kvm group.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Metro bundles the workspace packages from their dist output into the APK.
      - name: Build packages
        run: pnpm build

      - name: Generate the native project
        working-directory: examples/books-expo
        run: npx expo prebuild --platform android --no-install

      - name: Assemble the release APK
        working-directory: examples/books-expo/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Run the scripted swipe on an emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r examples/books-expo/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n dev.swipeline.expo/.MainActivity
            # The screen shows "✓ liked …" once the scripted swipe has run.
            for attempt in 1 2 3 4 5 6; do
              sleep 10
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
              if adb shell cat /sdcard/ui.xml 2>/dev/null | grep -q "liked"; then
                echo "The deck reported:"
                adb shell cat /sdcard/ui.xml | grep -o 'text="[^"]*liked[^"]*"' || true
                exit 0
              fi
            done
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/ui.xml 2>/dev/null || true
            echo "::error::the deck never reported a like"
            exit 1
