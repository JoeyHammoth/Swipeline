name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is needed for changeset status and for docs lastUpdated.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and property tests
        run: pnpm test -- --coverage

      - name: Ranking benchmark gate
        run: pnpm bench:gate

      - name: Build packages
        run: pnpm build

      - name: Typecheck example apps
        run: pnpm examples:typecheck

      - name: Build example apps
        run: pnpm examples:build

      - name: Package lint (exports, types, dual format)
        run: pnpm publint

      - name: Types are correct under all resolution modes
        run: pnpm attw

      - name: Dependency boundaries (no framework imports outside bindings)
        run: pnpm check:boundaries

      - name: Dependency license policy
        run: pnpm licenses:check

      - name: Published packages carry LICENSE and NOTICE
        run: pnpm package:licenses

      - name: Package license checker regression tests
        run: pnpm package:licenses:test

      # The publish itself needs a credential, but npm's own validation and the
      # tarball contents do not: this proves every package would be accepted by
      # the registry once it has one.
      - name: Packages are ready to publish
        run: pnpm publish:check

      - name: Publish checker regression tests
        run: pnpm publish:check:test

      # The checker itself runs after the browser suite in e2e.yml; its tests can
      # run anywhere.
      - name: Audit docs checker regression tests
        run: pnpm audit:docs:test

      - name: Adapter registry is valid and the catalog matches it
        run: pnpm registry:check

      - name: Registry checker regression tests
        run: pnpm registry:test

      # Second line of defence: dependency-review.yml gates what a PR adds, while
      # this audit checks the production tree that is actually installed.
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Schemas are exported
        run: |
          pnpm schemas:export
          git diff --exit-code -- docs/public/schemas

      - name: API reference is up to date
        run: |
          pnpm api:docs
          git diff --exit-code -- docs/reference/api.md

      - name: Docs internal links resolve
        run: pnpm docs:links

      - name: Docs link checker regression tests
        run: pnpm docs:links:test

      - name: Changeset present
        if: matrix.node == 24 && github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  dco:
    name: Developer Certificate of Origin
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit is signed off
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          commits=$(git rev-list --no-merges "$base..HEAD")
          if [ -z "$commits" ]; then
            echo "No commits to check."
            exit 0
          fi
          failed=0
          for commit in $commits; do
            subject=$(git log -1 --format=%s "$commit")
            if ! git log -1 --format=%B "$commit" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $commit ('$subject') is missing a Signed-off-by trailer. Use: git commit -s"
              failed=1
            fi
          done
          exit $failed

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:build
