name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Update this guard when the repository moves to the swipeline organisation.
    if: github.repository == 'JoeyHammoth/Swipeline'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # push version commits and tags
      pull-requests: write # open the Version Packages PR
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1; Node 24 ships a newer one, but
      # we pin the intent so a future base image change does not silently break it.
      - name: Ensure a trusted-publishing-capable npm
        run: npm install --global npm@latest && npm --version

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Nothing is on npm yet, and OIDC cannot bootstrap a package that does not
      # exist: npm only accepts a trusted publisher for a package that is already
      # there. The first publish needs a granular token with write access to the
      # `@swipeline` scope, stored as the `NPM_TOKEN` secret.
      - name: Check for a first-publish token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set. Publishing will fail with 404 Not Found until a granular npm token for the @swipeline scope is added as a repository secret."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 renamed these; the old names fail the step with "inputs have been
          # renamed" before anything is published.
          version-script: pnpm changeset version
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # A partial publish is worse than a failed one: some packages resolve and
      # some do not, and changesets reports success either way. This asks the
      # registry itself, so a skipped package fails the job instead.
      - name: Every published package version resolves on npm
        if: steps.changesets.outputs.published == 'true'
        run: pnpm publish:check:registry
