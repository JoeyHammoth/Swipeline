name: Quickstart

# Scaffolds every create-swipeline template and builds it. This is the M3
# acceptance job for "scaffold-and-build is green": it catches a template that
# stops compiling without waiting for someone to run the docs.
#
# The templates are scaffolded with workspace dependencies, because the packages
# are not on the registry yet. Once the first publish lands, this should also run
# one template against the published versions.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/create-swipeline/**"
      - "packages/core/**"
      - "packages/react/**"
      - "packages/element/**"
      - "packages/store-indexeddb/**"
      - "packages/adapter-*/**"
      - "scripts/check-templates.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/quickstart.yml"

permissions:
  contents: read

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates:
    name: Scaffold and build every template
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Scaffold and build the templates
        run: node scripts/check-templates.mjs --install
