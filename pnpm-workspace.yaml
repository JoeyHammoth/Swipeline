packages:
  - "packages/*"
  - "examples/*"

# pnpm 12 reads dependency build policy from this file. Keep the allowlist
# minimal and reviewed: esbuild downloads/verifies its platform binary at
# install time and the build toolchain needs it.
allowBuilds:
  esbuild: true

# Dependabot alerts on 2026-11-24: Vite dev-server advisories (one high) and an
# esbuild dev-server advisory. Both are dev-only, but the fixes are patch-level
# and the docs build exercises Vite, so they are pinned forward rather than
# dismissed. Revisit if VitePress stops supporting this Vite major.
# Expo SDK 58 shipped inside the minimum-release-age window when the smoke app
# was added. pnpm resolved exactly these first-party Expo versions; they are
# listed rather than disabling the age check for everything.
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.22"
  - "@expo/config-plugins@58.0.14"
  - "@expo/config@58.0.13"
  - "@expo/fingerprint@0.22.0"
  - "@expo/inline-modules@0.2.11"
  - "@expo/local-build-cache-provider@58.0.13"
  - "@expo/metro-config@58.0.24"
  - "@expo/metro-file-map@58.0.7"
  - "@expo/prebuild-config@58.0.21"
  - "@expo/router-server@58.0.24"
  - babel-preset-expo@58.0.27
  - expo-file-system@58.0.15
  - expo-modules-core@58.2.0
  - expo-modules-jsi@58.0.24
  - expo@58.1.0

overrides:
  vite: ^6.4.4
  "esbuild@<0.25.0": ^0.25.0
