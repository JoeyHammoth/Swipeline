<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="A card stack moving through a ranking pipeline into a swipeable deck">
  <defs>
    <linearGradient id="hero-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a6bff"/>
      <stop offset="1" stop-color="#25c2a0"/>
    </linearGradient>
    <linearGradient id="hero-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3b58"/>
      <stop offset="1" stop-color="#25c2a0"/>
    </linearGradient>
    <filter id="hero-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#05060f" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="960" height="320" fill="#0f1020"/>

  <!-- source rows -->
  <g fill="#1c1d31" stroke="#33355a">
    <rect x="40" y="46" width="196" height="18" rx="9"/>
    <rect x="40" y="80" width="150" height="18" rx="9"/>
    <rect x="40" y="114" width="176" height="18" rx="9"/>
    <rect x="40" y="148" width="128" height="18" rx="9"/>
  </g>
  <text x="40" y="200" fill="#9ea0c0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">any source</text>

  <!-- pipeline -->
  <path d="M260 106h150" stroke="url(#hero-flow)" stroke-width="3" stroke-linecap="round"/>
  <path d="M404 100l10 6-10 6" fill="none" stroke="#25c2a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#16172a" stroke="#3d3f63">
    <rect x="296" y="60" width="112" height="26" rx="13"/>
    <rect x="296" y="98" width="112" height="26" rx="13"/>
    <rect x="296" y="136" width="112" height="26" rx="13"/>
  </g>
  <g fill="#9ea0c0" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">
    <text x="310" y="78">seenFilter</text>
    <text x="310" y="116">tagAffinity</text>
    <text x="310" y="154">prefVector</text>
  </g>

  <!-- deck -->
  <path d="M432 112h108" stroke="url(#hero-flow)" stroke-width="3" stroke-linecap="round"/>
  <path d="M530 106l10 6-10 6" fill="none" stroke="#25c2a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#hero-shadow)">
    <g transform="rotate(-8 640 150)">
      <rect x="556" y="52" width="168" height="212" rx="18" fill="#1b1c30" stroke="#33355a"/>
    </g>
    <g transform="rotate(3 640 150)">
      <rect x="556" y="46" width="168" height="212" rx="18" fill="url(#hero-card)"/>
      <rect x="578" y="70" width="124" height="86" rx="10" fill="#0f1020" opacity="0.28"/>
      <rect x="578" y="170" width="92" height="12" rx="6" fill="#0f1020" opacity="0.45"/>
      <rect x="578" y="192" width="64" height="10" rx="5" fill="#0f1020" opacity="0.32"/>
      <g fill="#0f1020" opacity="0.55">
        <rect x="578" y="218" width="34" height="16" rx="8"/>
        <rect x="618" y="218" width="46" height="16" rx="8"/>
      </g>
    </g>
    <g transform="rotate(-4 760 160)">
      <rect x="744" y="66" width="168" height="212" rx="18" fill="#1b1c30" stroke="#33355a"/>
    </g>
  </g>

  <!-- action row -->
  <g>
    <circle cx="600" cy="292" r="15" fill="#1c1d31" stroke="#5a5c86"/>
    <path d="M594 286l12 12M606 286l-12 12" stroke="#ff7a90" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="646" cy="292" r="15" fill="#1c1d31" stroke="#5a5c86"/>
    <path d="M653 292a7 7 0 1 0-2 5" fill="none" stroke="#9ea0c0" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="692" cy="292" r="15" fill="#1c1d31" stroke="#5a5c86"/>
    <path d="M692 283l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#ffd166"/>
    <circle cx="738" cy="292" r="15" fill="#1c1d31" stroke="#5a5c86"/>
    <path d="M738 299s-8-5-8-11a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 6-8 11-8 11z" fill="#25c2a0"/>
  </g>

  <text x="860" y="196" fill="#9ea0c0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle">swipe</text>
</svg>
